name: Production cartography smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cartography:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Render and test choropleth + Local Moran
        run: |
          python - <<'PY'
          import json,time
          from urllib.request import Request,urlopen
          base="https://epigeodata.onrender.com"
          def post(payload):
              last=None
              for _ in range(10):
                  try:
                      req=Request(base+"/api/maps/professional-overlay",data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"},method="POST")
                      with urlopen(req,timeout=90) as r:
                          body=json.loads(r.read())
                          assert r.status==200 and body.get("image_url")
                      with urlopen(base+body["image_url"],timeout=60) as img:
                          data=img.read()
                          assert img.status==200 and len(data)>10000
                      return body
                  except Exception as e:
                      last=e; time.sleep(20)
              raise last
          post({"disease_key":"dengue","analysis_mode":"choropleth","selected_years":[2024]})
          post({"disease_key":"dengue","analysis_mode":"moran","selected_years":[2024]})
          print("PASS production choropleth and Local Moran PNG")
          PY
