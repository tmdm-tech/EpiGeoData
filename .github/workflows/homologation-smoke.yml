name: Homologation HTTP smoke tests
on:
  push:
    branches: [feat/catalogo-dados-integrado]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check live homologation HTTP endpoints
        env:
          BASE_URL: https://epigeodata-homologacao.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = os.environ['BASE_URL'].rstrip('/')

          def check(path, method='GET', payload=None, expected=200):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              headers = {'Content-Type': 'application/json'} if data is not None else {}
              request = Request(base + path, data=data, headers=headers, method=method)
              for attempt in range(1, 7):
                  try:
                      with urlopen(request, timeout=45) as response:
                          status = response.status
                          body = response.read(2_000_000)
                      break
                  except HTTPError as error:
                      status = error.code
                      body = error.read(2_000_000)
                      break
                  except (URLError, TimeoutError) as error:
                      print(f'{method} {path}: connection attempt {attempt}/6 failed: {error}', flush=True)
                      if attempt == 6:
                          raise
                      time.sleep(20)
              print(f'{method} {path}: HTTP {status}; body excerpt: {body[:1200].decode("utf-8", errors="replace")}', flush=True)
              assert status == expected, f'{method} {path}: expected HTTP {expected}, got {status}'
              return body

          check('/')
          datasets = json.loads(check('/api/catalog/datasets'))
          assert isinstance(datasets.get('datasets'), list), 'Catalog must return a datasets list'
          catalog_by_id = {item['id']: item for item in datasets['datasets']}
          required_local = {
              'pce_positividade', 'dengue_casos_provaveis', 'chikungunya_casos',
              'scz_eventos', 'tuberculose_confirmados',
              'temperatura_pontos', 'malha_municipal'
          }
          missing = required_local - set(catalog_by_id)
          assert not missing, f'Catalog missing registered datasets: {sorted(missing)}'
          unreadable = {key: catalog_by_id[key].get('read_error') for key in required_local if catalog_by_id[key].get('read_error')}
          assert not unreadable, f'Registered datasets must decode cleanly: {unreadable}'
          unavailable = [key for key in required_local if not catalog_by_id[key].get('available')]
          assert not unavailable, f'Registered datasets unavailable: {unavailable}'

          disease_expectations = {
              'esquistossomose': True,
              'dengue': True,
              'chikungunya': True,
              'scz': True,
              'tuberculose': True,
              'covid_19': False,
              'monkeypox': False,
              'oropouche': False,
          }
          for disease, expects_local in disease_expectations.items():
              payload = json.loads(check(f'/api/disease-data/{disease}'))
              assert payload.get('disease') == disease, f'{disease}: wrong disease payload'
              source = payload.get('source')
              if expects_local:
                  assert source, f'{disease}: expected a local CSV source'
                  assert payload.get('summary', {}).get('total_municipios', 0) > 0, f'{disease}: local CSV produced no municipalities'
              else:
                  assert source is None, f'{disease}: unexpected local CSV source {source}'
          # Validate the new live DATASUS adapter after Render has deployed this commit.
          # Official TABNET can be slow or temporarily unavailable, so 200 means
          # live data; 503 is accepted only when the API returns an explicit,
          # labelled local fallback rather than silently treating it as live.
          for disease in ('dengue', 'tuberculose', 'esquistossomose'):
              body = None
              status = None
              path = f'/api/datasus/live/{disease}'
              request = Request(base + path, method='GET')
              for attempt in range(1, 5):
                  try:
                      with urlopen(request, timeout=90) as response:
                          status = response.status
                          body = response.read(2_000_000)
                      break
                  except HTTPError as error:
                      status = error.code
                      body = error.read(2_000_000)
                      if status == 503:
                          break
                      raise
                  except (URLError, TimeoutError) as error:
                      print(f'GET {path}: DATASUS attempt {attempt}/4 failed: {error}', flush=True)
                      if attempt == 4:
                          raise
                      time.sleep(15)
              live_payload = json.loads(body)
              assert status in (200, 503), f'{disease}: unexpected live adapter HTTP {status}'
              if status == 200:
                  assert live_payload.get('status') == 'live', f'{disease}: HTTP 200 must be labelled live'
                  assert live_payload.get('source') == 'DATASUS/TABNET', f'{disease}: wrong live source'
                  assert live_payload.get('fallback_used') is False, f'{disease}: live response cannot use fallback'
                  assert isinstance(live_payload.get('rows'), list) and live_payload['rows'], f'{disease}: live TABNET returned no rows'
              else:
                  assert live_payload.get('status') == 'unavailable', f'{disease}: 503 must be explicit unavailable'
                  assert isinstance(live_payload.get('fallback'), dict), f'{disease}: 503 must expose labelled fallback'
              print(f'GET {path}: adapter status={live_payload.get("status")} HTTP={status}', flush=True)

          invalid = json.loads(check('/api/catalog/assess', 'POST', {}, 400))
          assert 'error' in invalid, 'Invalid catalog request must return an error'
          for path in ('/api/maps/epidemiological-gwr', '/api/maps/epidemiological-gwr-upload'):
              blocked = json.loads(check(path, 'POST', {}, 422))
              assert blocked.get('status') == 'blocked', f'{path} must remain fail-closed'
          print('PASS: homologation home, catalog, invalid input, and both GWR safeguards', flush=True)
          PY
