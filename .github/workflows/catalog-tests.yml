name: Catalog and stage 3 validation
on:
  push:
    branches: [feat/catalogo-dados-integrado]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run catalog unit and application integration tests
        run: python -m unittest discover -s tests -p 'test_*catalog*.py' -v
      - name: Run stage 3 validation and pipeline gate tests
        run: python -m unittest discover -s tests -p 'test_stage3*.py' -v
      - name: Compile guarded entrypoints
        run: python -m py_compile stage3_validation.py stage3_pipeline_gate.py scripts/run_validated_gwr.py wsgi_catalog.py
