name: Prepare geospatial scientific cube

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.csv"
      - "scripts/precompute_gwr_products.py"
      - "app.py"
      - "scripts/generate_choropleth_brazil.py"
      - "scripts/generate_epidemiological_gwr_maps.py"
      - "data/municipios_pe_ibge.geojson"
      - ".github/workflows/gwr-products.yml"
  schedule:
    - cron: "17 5 1 * *"
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        years:
          - "2001 2002 2003 2004 2005 2006"
          - "2007 2008 2009 2010 2011 2012"
          - "2013 2014 2015 2016 2017 2018"
          - "2019 2020 2021 2022 2023 2024"
          - "2025 2026"
    env:
      MPLBACKEND: Agg
      EPIGEODATA_DISABLE_GWR_PREWARM: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scientific dependencies
        run: pip install -r requirements.txt

      - name: Discover and prepare compatible dimensions
        shell: bash
        run: |
          set -e
          python scripts/precompute_gwr_products.py --all --years ${{ matrix.years }}

      - name: Validate canonical geospatial dimensions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path("data/climaticas")
          manifests=sorted(root.glob("manifest_climatico_pe_*.json"))
          assert manifests, "nenhum painel climático preparado"
          for m in manifests:
              meta=json.loads(m.read_text(encoding="utf-8"))
              year=int(meta["year"])
              p=root/f"painel_climatico_pe_{year}.csv"
              assert p.exists(), f"painel climático ausente: {year}"
              df=pd.read_csv(p,dtype={"municipio_ibge":str})
              assert df["municipio_ibge"].nunique() >= 184
              assert {"temperatura_media_c","precipitacao_anual_mm"}.issubset(df.columns)
              assert meta.get("independent_of_disease") is True
          for m in Path("data/gwr_products").glob("manifest_*.json"):
              data=json.loads(m.read_text(encoding="utf-8"))
              assert data.get("records_used",0)>=30
          print("validated climate years",len(manifests))
          PY

      - name: Upload scientific cube shard
        uses: actions/upload-artifact@v4
        with:
          name: climate-cube-${{ strategy.job-index }}
          path: |
            data/climaticas/painel_climatico_pe_*.csv
            data/climaticas/manifest_climatico_pe_*.json
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: climate-cube-*
          path: data/climaticas
          merge-multiple: true
      - name: Commit versioned scientific cube
        shell: bash
        run: |
          git config user.name "epigeodata-science-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/gwr_products data/climaticas/painel_climatico_pe_*.csv data/climaticas/manifest_climatico_pe_*.json
          # Do not reset generated climate panels after staging them.
          if git diff --cached --quiet; then
            echo "Scientific cube already current."
            exit 0
          fi
          git commit -m "data: update disease-neutral scientific cube [skip cube]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
