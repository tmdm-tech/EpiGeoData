name: Prepare validated GWR products

on:
  workflow_dispatch:
    inputs:
      disease:
        description: Disease dataset key
        required: true
        default: esquistossomose
      year:
        description: Analytical year
        required: true
        default: "2021"
      predictors:
        description: Space-separated predictors (temperatura precipitacao)
        required: true
        default: "temperatura precipitacao"
  push:
    branches: [main]
    paths:
      - "Esquistossomose.csv"
      - "Dengue.csv"
      - "scripts/precompute_gwr_products.py"
      - "app.py"
      - "scripts/generate_choropleth_brazil.py"
      - "scripts/generate_epidemiological_gwr_maps.py"
      - "data/municipios_pe_ibge.geojson"
      - ".github/workflows/gwr-products.yml"
  schedule:
    - cron: "17 5 1 * *"

permissions:
  contents: write

concurrency:
  group: gwr-products
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      EPIGEODATA_DISABLE_GWR_PREWARM: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scientific dependencies
        run: pip install -r requirements.txt

      - name: Resolve requested signature
        id: sig
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "disease=${{ inputs.disease }}" >> "$GITHUB_OUTPUT"
            echo "year=${{ inputs.year }}" >> "$GITHUB_OUTPUT"
            echo "predictors=${{ inputs.predictors }}" >> "$GITHUB_OUTPUT"
          else
            echo "disease=esquistossomose" >> "$GITHUB_OUTPUT"
            echo "year=2021" >> "$GITHUB_OUTPUT"
            echo "predictors=temperatura precipitacao" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare statewide validated GWR
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if python scripts/precompute_gwr_products.py \
              --disease "${{ steps.sig.outputs.disease }}" \
              --year "${{ steps.sig.outputs.year }}" \
              --predictors ${{ steps.sig.outputs.predictors }} \
              --force; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Official INMET endpoint unavailable on attempt $attempt; retrying in 30s..."
              sleep 30
            fi
          done
          exit 1

      - name: Legacy prepare command disabled
        if: ${{ false }}
        run: |
          python scripts/precompute_gwr_products.py \
            --disease "${{ steps.sig.outputs.disease }}" \
            --year "${{ steps.sig.outputs.year }}" \
            --predictors ${{ steps.sig.outputs.predictors }} \
            --force

      - name: Validate committed product
        shell: bash
        run: |
          test -d data/gwr_products
          test -f "data/climaticas/painel_climatico_pe_${{ steps.sig.outputs.year }}.csv"
          test -f "data/climaticas/manifest_climatico_pe_${{ steps.sig.outputs.year }}.json"
          test -n "$(find data/gwr_products -name 'manifest_*.json' -print -quit)"
          test -n "$(find data/gwr_products -name '*.geojson' -print -quit)"
          test -n "$(find data/gwr_products -name '*.png' -print -quit)"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/gwr_products")
          manifests=list(root.glob("manifest_*.json"))
          assert manifests, "manifesto GWR ausente"
          for manifest in manifests:
              data=json.loads(manifest.read_text(encoding="utf-8"))
              assert data.get("records_used",0) >= 30
              paths=[data["joined_geojson_file"], *data.get("map_files",{}).values()]
              for rel in paths:
                  p=Path(rel)
                  assert not p.is_absolute(), f"caminho absoluto não portável: {p}"
                  assert p.exists(), f"artefato ausente: {p}"
          PY

      - name: Commit versioned GWR products
        shell: bash
        run: |
          git config user.name "epigeodata-gwr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gwr_products data/climaticas/painel_climatico_pe_*.csv data/climaticas/manifest_climatico_pe_*.json
          # Keep versioned scientific outputs produced by this workflow.
          git checkout -- . ':!data/gwr_products' ':!data/climaticas/painel_climatico_pe_*.csv' ':!data/climaticas/manifest_climatico_pe_*.json' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "GWR products already current."
            exit 0
          fi
          git commit -m "data: publish validated GWR products [skip gwr]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
