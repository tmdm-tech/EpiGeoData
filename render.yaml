# Render Blueprint — EpiGeoData
# A branch de desenvolvimento usa a entrada Flask integrada ao catálogo.
services:
  - type: web
    name: epigeodata
    env: python
    buildCommand: pip install -r requirements.txt && python -m py_compile app.py scripts/precompute_gwr_products.py scripts/generate_epidemiological_gwr_maps.py
    startCommand: gunicorn wsgi_catalog:app --bind 0.0.0.0:$PORT
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: FLUTTER_ENV
        value: production
